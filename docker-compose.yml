
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filmfiesta-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: filmfiesta-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
